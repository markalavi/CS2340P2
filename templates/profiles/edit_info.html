{% extends 'base.html' %}

{% block body %}
<h1 class="text-center">Edit General Info</h1>
<hr/>
<div class="container-sm" style="max-width: 500px;">
	<form method="POST" class="d-flex flex-column gap-3">
		{% csrf_token %}

		<div>
			<label class="form-label" for="{{ template_data.profile_form.headline.id_for_label }}">Headline</label>
			{{ template_data.profile_form.headline }}
			<div class="text-danger small">{{ template_data.profile_form.headline.errors|striptags }}</div>
		</div>

		<div class="d-flex gap-2 justify-content-end">
			<a class="btn btn-outline-secondary" href="{% url 'profiles:me' %}">Cancel</a>
			<button type="submit" class="btn btn-primary">Save</button>
		</div>
	</form>
</div>
{% endblock %}
