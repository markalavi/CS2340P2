{% extends 'base.html' %}

{% block body %}
<div class="container-fluid">
	<h3 class="text-center">Login</h1>

	<form method="post" class="container-sm">
		{% csrf_token %}

		{{ form.as_p }}

		<input type="hidden" name="next" value="{{ next }}"></input>
		<button type="submit">Login</button>
	</form>

	<p class="text-center">No account? <a href="{% url 'accounts:signup' %}">Create one.</a></p>
</div>
{% endblock %}
