{% extends 'base.html' %}

{% block body %}
<div class="container-fluid">
	<h3 class="text-center">Create an account</h1>

	<form method="post" class="container-sm">
		{% csrf_token %}

		{{ template_data.form.as_p }}

		<input type="hidden" name="next" value="{{ next }}"></input>
		<button type="submit">Sign up</button>
	</form>

	<p class="text-center">Already have an account? <a href="{% url 'accounts:login' %}">Log in.</a></p>
</div>
{% endblock %}
